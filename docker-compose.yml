services:
  speedrace-bot:
    build: .
    image: speedrace-bot:latest
    container_name: speedrace-bot
    restart: unless-stopped
    env_file:
      - .env            # DISCORD_TOKEN (required), GUILD_ID (optional)
    environment:
      # create/keep sw_data.db inside the persistent cache volume
      SW_DATA_DB: /app/speedrace_bot/data/sw_data.db
    volumes:
      # swarfarm cache + auto-created sw_data.db survive restarts
      - speedrace-data:/app/speedrace_bot/data

volumes:
  speedrace-data:
